
name: GoRest API Automated Tests

on:
  push:
  workflow_dispatch:

jobs:
  automated-api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Newman
        run: npm install -g newman

      - name: Run GoRest API tests
        env:
          GOREST_TOKEN: ${{ secrets.GOREST_TOKEN }}
        run: |
          newman run GoRest.postman_collection.json \
            -e GoRest.postman_environment.json \
            -d users.csv \
            --env-var "token=$GOREST_TOKEN" \
            --reporters cli
