name: Automated API tests using Postman CLI

on:
  push:

jobs:
  automated-api-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Postman CLI
        shell: powershell
        run: |
          [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.SecurityProtocolType]::Tls12
          iex ((New-Object System.Net.WebClient).DownloadString('https://dl-cli.pstmn.io/install/win64.ps1'))

      - name: Login to Postman CLI
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
        run: postman login --with-api-key "$env:POSTMAN_API_KEY"

      - name: Run API tests
        run: |
          postman collection run "59055469-dbd9a4fc-c81b-4e47-b036-32ff57ead339" -e "59055469-fa8d851f-679e-44f2-8810-cb478432ba42" -d "users.csv"
